*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;flex:1}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);border:0;color:#fff;cursor:pointer}
main{padding:12px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}

nav button b{font-size:18px;font-weight:400}nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.sp{flex:1}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 2px 6px}
h3{margin:0 0 4px;font-size:15px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 2px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;min-height:42px}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.full{width:100%}
.mut{color:var(--mut);font-size:12px}.num{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.st{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.st.g{background:#d6f3e3;color:#0b6b3a}.st.w{background:var(--warnbg);color:var(--warn)}.st.b{background:#fde3df;color:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--mut);position:sticky;top:0;background:var(--card)}td.n,th.n{text-align:right}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink);white-space:nowrap}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:40px}
.sheet .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;z-index:2}
.sheet .body{padding:12px;max-width:760px;margin:0 auto}
.step{display:flex;align-items:center;gap:6px}.step button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;color:var(--ink)}.step span{min-width:30px;text-align:center;font-weight:700;font-size:17px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 12px;border-radius:10px;z-index:40;font-size:14px}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;color:var(--ink);font:inherit}
</style>

  document.addEventListener('change', (e) => {

    if (el.dataset.f !== undefined) { updatePreview(); return; }
    if (el.dataset.bind === 'date') { S.date = el.value || today(); render(); return; }
    if (['weather', 'rain', 'notes'].includes(el.dataset.bind)) { const rid = ensureReport(S.date), r = { ...MEM.daily_reports.get(rid) }; if (el.dataset.bind === 'weather') r.weather = el.value; if (el.dataset.bind === 'rain') r.rain_hours = N(el.value); if (el.dataset.bind === 'notes') r.notes = el.value; put('daily_reports', r); render(); return; }
    if (el.id === 'impf') { const f = el.files[0]; if (!f) return; f.text().then((t) => { const d = JSON.parse(t); let n = 0; TABLES.forEach((tb) => (d[tb] || []).forEach((r) => { const l = MEM[tb].get(r.id); if (!l || String(l.updated_at) < String(r.updated_at)) { MEM[tb].set(r.id, { ...r, _dirty: 1 }); n++; } persist(tb, [MEM[tb].get(r.id)]); })); ver++; render(); toast('Imported ' + n + ' rows'); scheduleSync(); }).catch(() => toast('Not a valid backup file')); return; }
    if (!S.edit) return; const { rid, id } = S.edit;
    if (el.dataset.qty !== undefined) { if (!setProgress(rid, id, N(el.value))) { /* rejected */ } render(); }
    else if (el.dataset.hrs) { const l = MEM.daily_labour.get(E.ids.labour(rid, id, el.dataset.hrs)); if (l && !l.deleted) setLabour(rid, id, el.dataset.hrs, l.workers, N(el.value) || 8); render(); }
    else if (el.dataset.mat) { setMaterial(rid, id, el.dataset.mat, N(el.value)); render(); }
  });
  document.addEventListener('input', (e) => { if (e.target.dataset.bind === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('[data-bind="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });

  // ---------------- start ----------------
  async function start() {
    await initStore(); await seedIfEmpty(); render();
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    setTimeout(() => doSync(false), 1500);
  }
  window.__app = { MEM, S, R, put, setProgress, setLabour, setMaterial, ensureReport, regenAllNorms, store, doSync, pending, render, META, start };
  start();
})();
